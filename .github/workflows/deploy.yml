name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Preserve server-managed files during sync
      - name: Deploy source code to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend,backend,compose.yml"
          target: /opt/arkalon/rps-league/
          overwrite: true
          rm: false

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/arkalon/rps-league
            export DEPLOY_SHA="${{ steps.sha.outputs.short }}"

            echo "Building images for commit: ${DEPLOY_SHA}"
            docker compose build

            echo "Restarting containers with new images..."
            docker compose up -d --force-recreate

            echo "Waiting 10s for backend healthcheck..."
            sleep 10

            docker exec rps-league-backend node -e "fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

            echo "Deployment of ${DEPLOY_SHA} complete and healthy!"